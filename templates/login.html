{% extends "base.html" %}

{% block title %}Sign In - SmartAttend{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-10">
    <div class="w-full max-w-md bg-white p-8 rounded-2xl border border-slate-200 shadow-xl shadow-slate-100">
        <!-- Logo & Header -->
        <div class="text-center mb-6">
            <div class="w-12 h-12 rounded-xl bg-blue-600 text-white flex items-center justify-center mx-auto mb-3 shadow-lg shadow-blue-500/25">
                <i data-lucide="scan-face" class="w-6 h-6"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Teacher Portal Sign In</h2>
            <p class="text-xs text-slate-500 mt-1">Smart Face Attendance Management System</p>
        </div>

        <!-- Login Form -->
        <form action="{{ url_for('login') }}" method="POST" class="space-y-4">
            <div>
                <label for="email" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Email Address</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="mail" class="w-4 h-4"></i>
                    </span>
                    <input type="email" id="email" name="email" value="admin@school.com" required placeholder="teacher@school.com"
                           class="w-full pl-9 pr-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                </div>
            </div>

            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label for="password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider">Password</label>
                    <a href="{{ url_for('forgot_password') }}" class="text-xs text-blue-600 hover:text-blue-500 font-medium">Forgot?</a>
                </div>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="lock" class="w-4 h-4"></i>
                    </span>
                    <input type="password" id="password" name="password" value="admin123" required placeholder="••••••••"
                           class="w-full pl-9 pr-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                </div>
            </div>

            <button type="submit" class="w-full py-2.5 px-4 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm shadow-md shadow-blue-500/20 transition flex items-center justify-center gap-2 mt-2">
                <i data-lucide="log-in" class="w-4 h-4"></i> Sign In to Dashboard
            </button>
        </form>

        <!-- Demo credentials box -->
        <div class="mt-6 p-3 rounded-lg bg-slate-50 border border-slate-200 text-xs text-slate-600">
            <span class="font-semibold text-slate-800">Preloaded Demo Credentials:</span><br>
            Email: <code class="text-blue-600">admin@school.com</code> &bull; Password: <code class="text-blue-600">admin123</code>
        </div>

        <div class="text-center mt-6 text-xs text-slate-500">
            New teacher account? 
            <a href="{{ url_for('register') }}" class="font-semibold text-blue-600 hover:text-blue-500">Register here</a>
        </div>
    </div>
</div>
{% endblock %}
