{% extends "base.html" %}

{% block title %}Reset Password - SmartAttend{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-10">
    <div class="w-full max-w-md bg-white p-8 rounded-2xl border border-slate-200 shadow-xl shadow-slate-100">
        <div class="text-center mb-6">
            <div class="w-12 h-12 rounded-xl bg-amber-500 text-white flex items-center justify-center mx-auto mb-3 shadow-lg shadow-amber-500/25">
                <i data-lucide="key-round" class="w-6 h-6"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Reset Password</h2>
            <p class="text-xs text-slate-500 mt-1">Answer your security question to set a new password</p>
        </div>

        <form action="{{ url_for('forgot_password') }}" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Registered Email</label>
                <input type="email" name="email" required placeholder="teacher@school.com"
                       class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Security Answer</label>
                <input type="text" name="sa" required placeholder="Enter the secret answer you saved"
                       class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">New Password</label>
                <input type="password" name="new_pwd" required placeholder="Enter new password"
                       class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
            </div>

            <button type="submit" class="w-full py-2.5 px-4 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm shadow-md shadow-blue-500/20 transition flex items-center justify-center gap-2 mt-2">
                <i data-lucide="refresh-cw" class="w-4 h-4"></i> Reset Password
            </button>
        </form>

        <div class="text-center mt-6 text-xs text-slate-500">
            Remember your credentials? 
            <a href="{{ url_for('login') }}" class="font-semibold text-blue-600 hover:text-blue-500">Sign in</a>
        </div>
    </div>
</div>
{% endblock %}
