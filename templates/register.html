{% extends "base.html" %}

{% block title %}Register Teacher - SmartAttend{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center py-10">
    <div class="w-full max-w-lg bg-white p-8 rounded-2xl border border-slate-200 shadow-xl shadow-slate-100">
        <!-- Logo & Header -->
        <div class="text-center mb-6">
            <div class="w-12 h-12 rounded-xl bg-blue-600 text-white flex items-center justify-center mx-auto mb-3 shadow-lg shadow-blue-500/25">
                <i data-lucide="user-plus" class="w-6 h-6"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Register Teacher Account</h2>
            <p class="text-xs text-slate-500 mt-1">Create an authorized account to manage student face attendance</p>
        </div>

        <!-- Registration Form -->
        <form action="{{ url_for('register') }}" method="POST" class="space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">First Name</label>
                    <input type="text" name="fname" required placeholder="Aayush"
                           class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Last Name</label>
                    <input type="text" name="lname" required placeholder="Karki"
                           class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Contact Number</label>
                    <input type="tel" name="contact" required placeholder="+977 9800000000"
                           class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Email Address</label>
                    <input type="email" name="email" required placeholder="teacher@school.com"
                           class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Security Question</label>
                    <select name="ssq" class="w-full px-3 py-2.5 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                        <option>Your Pet Name</option>
                        <option>Your Birth Place</option>
                        <option>Your Best Friend Name</option>
                        <option>Your Favorite Color</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Security Answer</label>
                    <input type="text" name="sa" required placeholder="Secret answer"
                           class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Password</label>
                    <input type="password" name="pwd" required placeholder="••••••••"
                           class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Confirm Password</label>
                    <input type="password" name="cpwd" required placeholder="••••••••"
                           class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                </div>
            </div>

            <button type="submit" class="w-full py-2.5 px-4 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm shadow-md shadow-blue-500/20 transition flex items-center justify-center gap-2 mt-4">
                <i data-lucide="check" class="w-4 h-4"></i> Complete Registration
            </button>
        </form>

        <div class="text-center mt-6 text-xs text-slate-500">
            Already have an account? 
            <a href="{{ url_for('login') }}" class="font-semibold text-blue-600 hover:text-blue-500">Sign in here</a>
        </div>
    </div>
</div>
{% endblock %}
